name: OPD Job

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: opd-global
  cancel-in-progress: false

jobs:
  opd:
    if: startsWith(github.event.issue.title, '[OPD]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Run OPD job
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python runner/job.py

      - name: Commit results
        if: always()
        env:
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f "results/jobs/$N/status.json" ]; then exit 0; fi
          backup="$(mktemp -d)"
          cp -r "results/jobs/$N" "$backup/job"
          # 先按常规方式提交（含缓存增删）；与其他任务并发写缓存冲突时，退回只提交本任务结果
          git add results
          git commit -m "opd: job #$N [skip ci]" || true
          if git pull --rebase --autostash origin main && git push origin HEAD:main; then
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "results/jobs/$N"
            cp -r "$backup/job" "results/jobs/$N"
            git add "results/jobs/$N"
            git commit -m "opd: job #$N [skip ci]" || true
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送失败，$((i * 5))s 后重试（$i/5）"
            sleep $((i * 5))
          done
          echo "结果提交失败" >&2
          exit 1

      - name: Report on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const n = context.issue.number;
            const statusPath = `results/jobs/${n}/status.json`;
            let st = null;
            try { st = JSON.parse(fs.readFileSync(statusPath, 'utf8')); } catch (e) {}
            let body;
            if (!st) {
              body = '任务异常结束，未生成状态文件，请查看 Actions 日志。';
            } else if (st.state === 'done') {
              const counts = Object.entries(st.result?.family_counts || {})
                .map(([k, v]) => `${k} ${v}`).join(' · ');
              // partial：到 24 分钟预算主动收尾，已抓到的可用，但仍有成员没跑
              const head = st.result?.partial
                ? `部分完成：${st.query}（时间预算用尽，剩余同族成员未抓取）`
                : `完成：${st.query}`;
              body = `${head}\n\n同族成员：${counts}\n\n`
                + `打开结果页：https://zzt00711.github.io/global-dossier/llm/?job=${n}`;
            } else if (st.state === 'running') {
              // Run OPD job 步被 30 分钟超时取消时，进程来不及写 error，状态会停在 running
              const lastLog = (st.logs || []).slice(-1)[0] || '';
              const q = st.query || '任务';
              body = `未完成：${q} 在 30 分钟内未抓完，Actions 已超时取消。\n\n`
                + (lastLog ? `最后进度：${lastLog}\n\n` : '')
                + `已完成的部分已保存：https://zzt00711.github.io/global-dossier/llm/?job=${n}\n\n`
                + `可稍后重新提交，已抓到的结果会在 72 小时内复用。`;
            } else {
              body = `失败：${st.error || '未知错误'}\n\n请查看 Actions 日志。`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, body
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, state: 'closed'
            });
