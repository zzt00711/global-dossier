name: OPD Job

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: opd-global
  cancel-in-progress: false

jobs:
  opd:
    if: startsWith(github.event.issue.title, '[OPD]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Run OPD job
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python runner/job.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "opd: job #${{ github.event.issue.number }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Report on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const n = context.issue.number;
            const statusPath = `results/jobs/${n}/status.json`;
            let st = null;
            try { st = JSON.parse(fs.readFileSync(statusPath, 'utf8')); } catch (e) {}
            let body;
            if (!st) {
              body = '任务异常结束，未生成状态文件，请查看 Actions 日志。';
            } else if (st.state === 'done') {
              const counts = Object.entries(st.result?.family_counts || {})
                .map(([k, v]) => `${k} ${v}`).join(' · ');
              body = `完成：${st.query}\n\n同族成员：${counts}\n\n`
                + `打开结果页：https://zzt00711.github.io/global-dossier/llm/?job=${n}`;
            } else {
              body = `失败：${st.error || '未知错误'}\n\n请查看 Actions 日志。`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, body
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, state: 'closed'
            });
