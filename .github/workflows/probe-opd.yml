name: Probe OPD
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-opd.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests
      - name: Probe
        shell: bash
        run: |
          python - <<'PY'
          import json, time, requests
          BASE = "https://www.j-platpat.inpit.go.jp"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          H = {"Content-Type": "application/json",
               "Accept": "application/json, text/plain, */*",
               "Origin": BASE, "Referer": BASE + "/h0200", "User-Agent": UA}
          body = {"DISP_ID": "H0200", "SVC": "jpp", "BIZ_MENU": "family-list",
                  "BUL_TYPE": "publication",
                  "INQRY_NUM": {"CNTRY_CD_PART": "CN", "NUM_PART": "116774691", "KIND_CD_PART": "A"},
                  "OTID": None}
          try:
              print("egress:", requests.get("https://api.ipify.org", timeout=15).text)
          except Exception as e:
              print("egress fail:", e)
          for i in range(6):
              s = requests.Session()
              s.headers.update({"User-Agent": UA})
              warm = ""
              try:
                  g = s.get(BASE + "/h0200", timeout=30)
                  warm = f"warm={g.status_code}"
              except Exception as e:
                  warm = f"warm=ERR {e}"
              try:
                  r = s.post(BASE + "/app/opdgw/wsh0701",
                             data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
                             headers=H, timeout=60)
                  info = (r.json().get("RSLT_INFO") or {})
                  print(f"try{i} http={r.status_code} {warm} cd={info.get('STATUS_CD_A')} "
                        f"msg={json.dumps(info.get('MSG_LIST'), ensure_ascii=False)[:120]} "
                        f"hdr={r.headers.get('Server')} via={r.headers.get('via')}")
              except Exception as e:
                  print(f"try{i} {warm} EXC {type(e).__name__} {e}")
              time.sleep(4)
          PY
